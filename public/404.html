<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <script>
      var redirect = sessionStorage.getItem("spa-redirect");
      if (!redirect) {
        var path = window.location.pathname + window.location.search + window.location.hash;
        sessionStorage.setItem("spa-redirect", path);
      }
      window.location.replace("/");
    </script>
  </head>
  <body>
    <p>正在跳转...</p>
  </body>
</html>
